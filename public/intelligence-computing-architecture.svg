<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Ubiquitous &amp; Intelligence Computing Group research house</title>
  <desc id="desc">A house-shaped research architecture with Hardware as the foundation, Systems and Networks and Intelligence as middle floors, Humans as the top floor, and Applications as the roof.</desc>

  <rect width="1600" height="1100" fill="#f4f1e8"/>
  <rect x="54" y="48" width="1492" height="1004" fill="#fffefa" stroke="#cfd6d1" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="100" y="110" fill="#0b6b57" font-size="19" font-weight="700">FIGURE 1 / RESEARCH HOUSE</text>
    <text x="100" y="168" fill="#14201d" font-size="45" font-weight="800">Ubiquitous &amp; Intelligence Computing Group</text>

    <polygon points="800,208 1470,480 130,480" fill="#14201d"/>
    <rect x="1170" y="254" width="92" height="116" fill="#14201d"/>
    <rect x="1170" y="244" width="92" height="12" fill="#c9544b"/>

    <text x="800" y="326" fill="#f3aaa3" font-size="19" font-weight="800" text-anchor="middle">APPLICATIONS</text>
    <text x="800" y="370" fill="#fffefa" font-size="32" font-weight="700" text-anchor="middle">Built across the full research house</text>
    <text x="800" y="420" fill="#d8e1dd" font-size="19" font-weight="700" text-anchor="middle">Health &amp; wellbeing  /  Robotics &amp; autonomy  /  Education  /  Smart environments</text>

    <g>
      <rect x="240" y="480" width="1120" height="100" fill="#fae9e6"/>
      <rect x="240" y="480" width="12" height="100" fill="#c9544b"/>
      <text x="282" y="522" fill="#c9544b" font-size="17" font-weight="800">04</text>
      <text x="338" y="522" fill="#c9544b" font-size="18" font-weight="800">HUMANS</text>
      <text x="560" y="542" fill="#14201d" font-size="25" font-weight="700">People, interaction &amp; trust</text>
      <text x="1030" y="532" fill="#5e6a66" font-size="17">Privacy / HCI / Trust / Accessibility / Safety</text>
    </g>

    <g>
      <rect x="240" y="580" width="1120" height="100" fill="#e8eef8"/>
      <rect x="240" y="580" width="12" height="100" fill="#275ea6"/>
      <text x="282" y="622" fill="#275ea6" font-size="17" font-weight="800">03</text>
      <text x="338" y="622" fill="#275ea6" font-size="18" font-weight="800">INTELLIGENCE</text>
      <text x="560" y="642" fill="#14201d" font-size="25" font-weight="700">Learning &amp; adaptation</text>
      <text x="1030" y="632" fill="#5e6a66" font-size="17">ML / Agents / Perception / Reasoning</text>
    </g>

    <g>
      <rect x="240" y="680" width="1120" height="100" fill="#e4f0eb"/>
      <rect x="240" y="680" width="12" height="100" fill="#0b6b57"/>
      <text x="282" y="722" fill="#0b6b57" font-size="17" font-weight="800">02</text>
      <text x="338" y="722" fill="#0b6b57" font-size="18" font-weight="800">SYSTEMS &amp; NETWORKS</text>
      <text x="560" y="742" fill="#14201d" font-size="25" font-weight="700">Connected infrastructure</text>
      <text x="1030" y="732" fill="#5e6a66" font-size="17">IoT / Edge + cloud / Distributed systems</text>
    </g>

    <g>
      <rect x="240" y="780" width="1120" height="100" fill="#f8eed8"/>
      <rect x="240" y="780" width="12" height="100" fill="#d99a37"/>
      <text x="282" y="822" fill="#9b651e" font-size="17" font-weight="800">01</text>
      <text x="338" y="822" fill="#9b651e" font-size="18" font-weight="800">HARDWARE</text>
      <text x="560" y="842" fill="#14201d" font-size="25" font-weight="700">Devices &amp; sensing</text>
      <text x="1030" y="832" fill="#5e6a66" font-size="17">Sensors / Devices / Embedded platforms</text>
    </g>

    <rect x="222" y="480" width="18" height="400" fill="#14201d"/>
    <rect x="1360" y="480" width="18" height="400" fill="#14201d"/>

    <g>
      <rect x="178" y="900" width="1244" height="58" fill="#14201d"/>
      <line x1="593" y1="900" x2="593" y2="958" stroke="#65716d"/>
      <line x1="1008" y1="900" x2="1008" y2="958" stroke="#65716d"/>
      <text x="384" y="936" fill="#fffefa" font-size="18" font-weight="700" text-anchor="middle">FACULTY LABS</text>
      <text x="800" y="936" fill="#fffefa" font-size="18" font-weight="700" text-anchor="middle">STUDENT LEARNING</text>
      <text x="1215" y="936" fill="#fffefa" font-size="18" font-weight="700" text-anchor="middle">FUNDING + OUTREACH</text>
    </g>

    <text x="100" y="1006" fill="#5e6a66" font-size="17">Lab strengths live on different floors. Collaboration paths connect them to shared applications.</text>
    <text x="1500" y="1006" fill="#5e6a66" font-size="17" text-anchor="end">ubiquitous &amp; intelligence computing group</text>
  </g>
</svg>
