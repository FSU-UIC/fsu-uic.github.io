name: Render UbiComp flyer

on:
  push:
    branches: [main]
    paths:
      - assets/flyers/fsu-uic-imwut-ubicomp-2026-card-v13.html
      - scripts/render-flyer.mjs
      - .github/workflows/render-flyer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install rendering tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Render flyer
        run: |
          node scripts/render-flyer.mjs
          pdftoppm -png -r 300 -singlefile \
            assets/flyers/fsu-uic-imwut-ubicomp-2026-card-v13.pdf \
            assets/flyers/fsu-uic-imwut-ubicomp-2026-card-v13

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/flyers/fsu-uic-imwut-ubicomp-2026-card-v13.pdf \
            assets/flyers/fsu-uic-imwut-ubicomp-2026-card-v13.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate UbiComp flyer exports"
          git push
